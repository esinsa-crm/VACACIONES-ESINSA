<html lang="es">

<meta charset="UTF-8">

<title>ESINSA – Vacaciones 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;font-size:13px}
header{background:#1e2a4a;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:18px}
header span{font-size:12px;color:#aac}
.toolbar{background:#fff;padding:10px 20px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{padding:6px 14px;border:1px solid #ccc;border-radius:6px;background:#f5f5f5;cursor:pointer;font-size:13px}
button.active{background:#1e2a4a;color:#fff;border-color:#1e2a4a}
button:hover:not(.active){background:#e8e8e8}
.nav{font-size:18px;padding:4px 10px}
#mesLabel{font-weight:700;font-size:15px;min-width:140px;text-align:center}
.main{padding:16px 20px}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.leg{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 6px;border:1px solid #ddd;border-radius:20px;cursor:pointer;font-size:12px;background:#fff;user-select:none}
.leg.off{opacity:0.3}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px 16px;font-size:12px;color:#555}
.stat b{display:block;font-size:20px;color:#1e2a4a}
.stat.warn b{color:#e67e22}
.stat.err b{color:#c0392b}
.wrap{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th{background:#f0f0f0;font-size:11px;padding:4px 2px;text-align:center;border-bottom:1px solid #ccc;position:sticky;top:0;z-index:2;white-space:nowrap}
th.emp{text-align:left;padding-left:6px;width:140px;min-width:100px;max-width:140px}
td{padding:1px;border-bottom:1px solid #f0f0f0}
td.emp{padding:2px 5px;font-size:11px;font-weight:500;position:sticky;left:0;background:#fff;border-right:1px solid #e0e0e0;z-index:1;white-space:nowrap;width:140px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
td.day{width:22px;text-align:center}
.blk{width:100%;height:18px;border-radius:3px;display:block}
.blk.clickable{cursor:pointer}
.blk.clickable:hover{opacity:0.75;outline:2px solid #1e2a4a}
tr.dept td{background:#f7f7fb;font-size:11px;font-weight:700;color:#444;padding:5px 8px;border-top:2px solid #ccc;letter-spacing:.5px;text-transform:uppercase}
.ann-blk{border-radius:4px;padding:2px 3px;font-size:11px;font-weight:600;display:block;text-align:center}
.add-section{margin-top:14px}
.save{background:#27ae60!important;color:#fff!important;border-color:#27ae60!important}
.edit-btn{background:#2563eb!important;color:#fff!important;border-color:#2563eb!important}
.del-btn{background:#c0392b!important;color:#fff!important;border-color:#c0392b!important;font-size:11px!important;padding:4px 8px!important}
.lock-btn{background:#7c3aed!important;color:#fff!important;border-color:#7c3aed!important}
.pend-table{width:100%;border-collapse:collapse}
.pend-table th{background:#f0f0f0;padding:7px 10px;font-size:12px;text-align:left;border-bottom:1px solid #ccc}
.pend-table td{padding:6px 10px;font-size:12px;border-bottom:1px solid #f0f0f0}
.bar-bg{background:#eee;border-radius:4px;height:8px;overflow:hidden;display:inline-block;width:80px;vertical-align:middle}
.bar-fg{height:8px;border-radius:4px}
/* Modal */
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;min-width:340px;max-width:500px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.2)}
.modal h3{margin-bottom:16px;color:#1e2a4a;font-size:16px}
.modal label{font-size:12px;color:#555;display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.modal input,.modal select{font-size:13px;padding:6px 9px;border:1px solid #ccc;border-radius:6px}
.modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
/* Banner modo vista */
.view-banner{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:8px 14px;font-size:12px;color:#92400e;display:none;align-items:center;gap:8px;margin-bottom:10px}
.view-banner.show{display:flex}
/* Filtros chip */
.chip{display:inline-flex;align-items:center;gap:5px;background:#e0f2fe;border:1px solid #7dd3fc;border-radius:20px;padding:3px 10px;font-size:12px;color:#0369a1;cursor:pointer}
.chip:hover{background:#bae6fd}
</style>

<body>

<!-- MODAL LOGIN -->
<div class="modal-bg open" id="loginModal">
  <div class="modal" style="max-width:380px">
    <h3>🔐 ESINSA — Vacaciones 2026</h3>
    <p style="font-size:12px;color:#666;margin-bottom:16px">Accede como administrador para editar, o entra en modo solo lectura para ver el calendario.</p>
    <label>Contraseña de administrador
      <input type="password" id="loginPwd" placeholder="Introduce la contraseña..." onkeydown="if(event.key==='Enter')loginAdmin()">
    </label>
    <p id="loginErr" style="color:#c0392b;font-size:12px;display:none;margin-top:-6px">Contraseña incorrecta</p>
    <div class="modal-btns" style="justify-content:space-between">
      <button onclick="loginViewer()" style="background:#f0f4ff;border-color:#c7d2fe;color:#3730a3">👁 Solo ver</button>
      <button class="lock-btn" onclick="loginAdmin()">🔓 Entrar como admin</button>
    </div>
  </div>
</div>

<!-- MODAL AÑADIR / EDITAR -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Añadir vacaciones</h3>
    <label>Empleado
      <select id="mEmp" style="min-width:220px"></select>
    </label>
    <label>Fecha inicio
      <input type="date" id="mIni" value="2026-06-01">
    </label>
    <label>Fecha fin
      <input type="date" id="mFin" value="2026-06-05">
    </label>
    <label>Tipo
      <select id="mTipo" onchange="toggleOtroTipo()">
        <option value="vac">Vacaciones</option>
        <option value="boda">Ausencia por boda</option>
        <option value="examen">Ausencia por examen</option>
        <option value="otro">Otro (especificar)...</option>
      </select>
    </label>
    <label id="otroTipoLabel" style="display:none">Descripción de la ausencia
      <input type="text" id="mTipoOtro" placeholder="Ej: Mudanza, Médico, Paternidad..." maxlength="50">
    </label>
    <div class="modal-btns">
      <button onclick="closeModal()">Cancelar</button>
      <button class="save" id="modalSaveBtn" onclick="modalGuardar()">✔ Guardar</button>
    </div>
  </div>
</div>

<header>
  <h1>ESINSA — Calendario de Vacaciones 2026</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="hdrInfo">27 empleados</span>
    <span id="modoLabel" style="font-size:11px;padding:3px 10px;border-radius:20px;background:#ffffff22;border:1px solid #ffffff44"></span>
    <button id="btnCambiarModo" onclick="cambiarModo()" style="font-size:11px;padding:3px 10px;background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:6px">Cambiar modo</button>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <button id="bMes" class="active" onclick="setView('mes')">📅 Mensual</button>
  <button id="bAnu" onclick="setView('anual')">📊 Anual</button>
  <button id="bPend" class="admin-only" style="display:none" onclick="setView('pend')">⏳ Pendientes</button>
  <span style="border-left:1px solid #ddd;height:24px;margin:0 4px"></span>
  <button class="nav" id="bPrev" onclick="prevMes()">◀</button>
  <span id="mesLabel"></span>
  <button class="nav" id="bNext" onclick="nextMes()">▶</button>
  <span style="border-left:1px solid #ddd;height:24px;margin:0 4px"></span>
  <!-- Filtro por empleado -->
  <label style="font-size:12px;color:#555;display:flex;align-items:center;gap:6px">
    🔍 Empleado:
    <select id="filtroEmp" onchange="setFiltroEmp()" style="font-size:12px;padding:4px 8px;border:1px solid #ccc;border-radius:6px;max-width:190px">
      <option value="">— Todos —</option>
    </select>
  </label>
  <!-- Filtros de vacaciones activas -->
  <button id="btnFiltroMes" onclick="toggleFiltroMes()" title="Mostrar solo empleados con vacaciones este mes">📆 Solo este mes</button>
  <button id="btnFiltroHoy" onclick="toggleFiltroHoy()" title="Mostrar solo empleados con vacaciones hoy o esta semana">📍 Hoy / semana</button>
  <button onclick="resetTodosFiltros()" id="btnResetFiltro" style="display:none;background:#fee2e2;border-color:#fca5a5;color:#b91c1c;font-size:12px;padding:4px 10px">✕ Quitar filtros</button>
</div>

<div class="main">
  <div class="view-banner" id="viewBanner">
    👁 Modo <b>Solo lectura</b> — Puedes ver el calendario pero no modificar nada.
  </div>
  <div class="legend" id="leyenda"></div>
  <div class="stats" id="stats"></div>
  <div class="wrap" id="cal"></div>
  <div class="add-section" id="addSection" style="display:none;margin-top:14px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button onclick="openModal('add')">＋ Añadir vacaciones / ausencia</button>
      <button class="edit-btn" onclick="setView('gestionar')">✏️ Gestionar / Editar vacaciones</button>
      <label style="background:#0891b2;color:#fff;border:1px solid #0891b2;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px">
        📥 Importar Excel Endalia
        <input type="file" id="inputEndalia" accept=".xlsx,.xls,.csv" style="display:none" onchange="importarEndalia(event)">
      </label>
    </div>
    <div id="importResult" style="display:none;margin-top:8px;padding:10px 14px;border-radius:8px;font-size:12px"></div>
  </div>
</div>

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function dept(e)  { return PDEPT[PUESTOS[e]]||"Otros"; }
function col(e)   { return DCOL[dept(e)]||"#888"; }
function sn(e)    { const p=e.split(", "); if(p.length<2) return e.substring(0,18); return p[1].split(" ")[0]+" "+p[0].split(" ")[0]; }
function isWE(y,m,d){ const w=new Date(y,m,d).getDay(); return w===0||w===6; }
function hexA(h,a){ const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }
function fmt(s)   { if(!s) return ""; const [y,mo,d]=s.split("-"); return `${d}/${mo}/${y}`; }
function tipoLabel(t){ return t==="boda"?"Ausencia boda":t==="examen"?"Ausencia examen":t==="vac"?"Vacaciones":t; }
function tipoColor(t,c){ return t==="boda"?"#c0392b":t==="examen"?"#e67e22":t==="vac"?c:"#f39c12"; }
function toggleOtroTipo(){
  const v=document.getElementById("mTipo").value;
  document.getElementById("otroTipoLabel").style.display=v==="otro"?"flex":"none";
  if(v==="otro") document.getElementById("mTipoOtro").focus();
}

// Días de vacaciones usados en el año (solo vac, no ausencias)
function diasUsados(e){
  let n=0;
  VACS.filter(v=>v.e===e&&v.t==="vac").forEach(v=>{
    let d=new Date(v.i+"T00:00"); const end=new Date(v.f+"T00:00");
    while(d<=end){ if(!isWE(d.getFullYear(),d.getMonth(),d.getDate())) n++; d.setDate(d.getDate()+1); }
  });
  return n;
}
function diasPendientes(e){ return Math.max(0,(MAX[e]||0)-diasUsados(e)); }

function vacMap(e,y,m){
  const map={};
  VACS.forEach((v,idx)=>{ if(v.e!==e) return;
    let d=new Date(v.i+"T00:00"); const end=new Date(v.f+"T00:00");
    while(d<=end){ if(d.getFullYear()===y&&d.getMonth()===m) map[d.getDate()]={t:v.t,idx}; d.setDate(d.getDate()+1); }
  });
  return map;
}
function cntVac(e,y,m){
  let n=0;
  VACS.filter(v=>v.e===e).forEach(v=>{
    let d=new Date(v.i+"T00:00"); const end=new Date(v.f+"T00:00");
    while(d<=end){ if(d.getFullYear()===y&&d.getMonth()===m&&!isWE(y,m,d.getDate())) n++; d.setDate(d.getDate()+1); }
  });
  return n;
}
function tieneVacMes(e,y,m){ return cntVac(e,y,m)>0; }
function tieneVacHoy(e){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  // calcular inicio y fin de semana actual
  const dow=hoy.getDay(); // 0=dom
  const lunes=new Date(hoy); lunes.setDate(hoy.getDate()-(dow===0?6:dow-1));
  const domingo=new Date(lunes); domingo.setDate(lunes.getDate()+6);
  return VACS.some(v=>{
    if(v.e!==e) return false;
    const ini=new Date(v.i+"T00:00"), fin=new Date(v.f+"T00:00");
    return ini<=domingo && fin>=lunes;
  });
}

// ─── EMPLEADOS FILTRADOS ──────────────────────────────────────────────────────
function emps(){
  const y=2026, m=mes;
  return Object.keys(PUESTOS).sort((a,b)=>{
    const da=dept(a),db=dept(b);
    const ia=DEPT_ORDER.indexOf(da),ib=DEPT_ORDER.indexOf(db);
    if(ia!==ib) return ia-ib;
    const pa=PUESTOS[a],pb=PUESTOS[b];
    const rA=pa.startsWith("Jefe")||pa==="CEO"||pa.startsWith("Director")||pa.startsWith("Supervisora")?0:1;
    const rB=pb.startsWith("Jefe")||pb==="CEO"||pb.startsWith("Director")||pb.startsWith("Supervisora")?0:1;
    if(rA!==rB) return rA-rB;
    return a.localeCompare(b);
  }).filter(e=>{
    if(hideDept.has(dept(e))) return false;
    if(filtroEmpVal && e!==filtroEmpVal) return false;
    if(filtroMes && !tieneVacMes(e,y,m)) return false;
    if(filtroHoy && !tieneVacHoy(e)) return false;
    return true;
  });
}

// ─── VISTA MENSUAL ────────────────────────────────────────────────────────────
function renderMes(){
  const y=2026,m=mes,nd=new Date(y,m+1,0).getDate(),ee=emps(),hoy=new Date();
  const DS=["D","L","M","X","J","V","S"];
  let h=`<table><thead><tr><th class="emp">Empleado</th>`;
  for(let d=1;d<=nd;d++){
    const we=isWE(y,m,d),isH=hoy.getFullYear()===y&&hoy.getMonth()===m&&hoy.getDate()===d;
    h+=`<th style="${we?"color:#bbb":""}${isH?";background:#fff3cd":""}">${DS[new Date(y,m,d).getDay()]}<br>${d}</th>`;
  }
  h+=`</tr></thead><tbody>`;
  let curD="";
  ee.forEach(e=>{
    const d=dept(e);
    if(d!==curD){curD=d;h+=`<tr class="dept"><td colspan="${nd+1}" style="color:${DCOL[d]||"#555"}">${d}</td></tr>`;}
    const vm=vacMap(e,y,m),c=col(e);
    // días pendientes en columna de nombre solo para admin
    const pendBadge=isAdmin&&diasPendientes(e)>0?` <span style="background:#fee2e2;color:#b91c1c;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700">${diasPendientes(e)}p</span>`:"";
    h+=`<tr><td class="emp" style="border-left:3px solid ${c}" title="${e}">${sn(e)}${pendBadge}<br><span style="font-size:10px;color:#999;font-weight:400">${PUESTOS[e]}</span></td>`;
    for(let d=1;d<=nd;d++){
      const we=isWE(y,m,d),entry=vm[d],vt=entry?entry.t:null,idx=entry?entry.idx:null;
      const isH=hoy.getFullYear()===y&&hoy.getMonth()===m&&hoy.getDate()===d;
      const bg=we?"background:#f0f0f0":vt?`background:${tipoColor(vt,c)}`:"";
      const tip=vt?tipoLabel(vt)+" · "+sn(e):"";
      const click=(isAdmin&&!we&&vt!==null)?`onclick="openModal('edit',${idx})"`:isAdmin&&!we?`onclick="openModalDia('${e}','2026-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}')"`:""
      h+=`<td class="day" style="${isH?"background:#fffbe6":""}" title="${tip}"><div class="blk ${isAdmin&&!we?"clickable":""}" style="${bg}" ${click}></div></td>`;
    }
    h+=`</tr>`;
  });
  h+=`</tbody></table>`;
  document.getElementById("cal").innerHTML=h;
  document.getElementById("mesLabel").textContent=MESES[m]+" 2026";
  document.getElementById("bPrev").disabled=m===0;
  document.getElementById("bNext").disabled=m===11;
  ["bPrev","bNext","mesLabel"].forEach(id=>document.getElementById(id).style.display="");
}

        <td style="padding:5px 8px;display:flex;gap:5px;justify-content:center">
          <button class="edit-btn" style="font-size:11px;padding:3px 10px" onclick="openModal('edit',${v.idx})">✏️ Editar</button>
          <button class="del-btn" onclick="eliminar(${v.idx})">🗑</button>
        </td>
      </tr>`;
    });
    h+=`</tbody></table></div>`;
  });
  h+=`</div>`;
  document.getElementById("cal").innerHTML=h;
  const gsel=document.getElementById("gFiltro");
  if(gsel) gsel.addEventListener("change",()=>{gFiltroVal=gsel.value;renderGestionar();});
}
let gFiltroVal="";
function gFiltroChange(){ gFiltroVal=document.getElementById("gFiltro").value; renderGestionar(); }

// ─── MODAL AÑADIR / EDITAR ────────────────────────────────────────────────────
function openModal(mode,idx){
  if(!isAdmin) return;
  editIdx=(mode==="edit")?idx:null;
  document.getElementById("modalTitle").textContent=mode==="edit"?"✏️ Editar vacaciones":"＋ Añadir vacaciones";
  document.getElementById("modalSaveBtn").textContent=mode==="edit"?"✔ Guardar cambios":"✔ Guardar";
  if(mode==="edit"&&idx!==null){
    const v=VACS[idx];
    document.getElementById("mEmp").value=v.e;
    document.getElementById("mIni").value=v.i;
    document.getElementById("mFin").value=v.f;
    const std=["vac","boda","examen"];
    if(std.includes(v.t)){
      document.getElementById("mTipo").value=v.t;
      document.getElementById("otroTipoLabel").style.display="none";
    } else {
      document.getElementById("mTipo").value="otro";
      document.getElementById("mTipoOtro").value=v.t;
      document.getElementById("otroTipoLabel").style.display="flex";
    }
  } else {
    document.getElementById("mEmp").value=idx||"";
    document.getElementById("mIni").value="2026-06-01";
    document.getElementById("mFin").value="2026-06-05";
    document.getElementById("mTipo").value="vac";
    document.getElementById("otroTipoLabel").style.display="none";
  }
  document.getElementById("modalBg").classList.add("open");
}
// Clic en día vacío: abrir modal para añadir con empleado y fecha pre-rellenados
function openModalDia(emp,fecha){
  if(!isAdmin) return;
  openModal("add",emp||"");
  document.getElementById("mEmp").value=emp;
  document.getElementById("mIni").value=fecha;
  document.getElementById("mFin").value=fecha;
}
function closeModal(){ document.getElementById("modalBg").classList.remove("open"); editIdx=null; }
function modalGuardar(){
  const e=document.getElementById("mEmp").value;
  const i=document.getElementById("mIni").value;
  const f=document.getElementById("mFin").value;
  let t=document.getElementById("mTipo").value;
  if(t==="otro"){
    const desc=document.getElementById("mTipoOtro").value.trim();
    if(!desc){alert("Escribe una descripción para el tipo de ausencia");return;}
    t=desc;
  }
  if(!e||!i||!f){alert("Rellena todos los campos");return;}
  if(new Date(i)>new Date(f)){alert("La fecha inicio debe ser anterior al fin");return;}
  if(editIdx!==null){VACS[editIdx]={e,i,f,t};}
  else{VACS.push({e,i,f,t});}
  closeModal(); renderStats(); render();
}
function eliminar(idx){
  const v=VACS[idx];
  if(!confirm(`¿Eliminar este período de ${sn(v.e)}?
${fmt(v.i)} → ${fmt(v.f)}`)) return;
  VACS.splice(idx,1); renderStats(); render();
}

// ─── NAVEGACIÓN ───────────────────────────────────────────────────────────────
function setView(v){
  if(!isAdmin&&(v==="pend"||v==="gestionar")) return;
  view=v;
  ["bMes","bAnu","bPend"].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove("active");});
  const map={mes:"bMes",anual:"bAnu",pend:"bPend"};
  if(map[v]){const el=document.getElementById(map[v]);if(el)el.classList.add("active");}
  render();
}
function tgDept(d){
  // Si ya está seleccionado solo ese, volver a mostrar todos
  if(soloDept===d){ soloDept=''; hideDept.clear(); }
  // Si hay otro seleccionado o ninguno, mostrar solo el clickado
  else { soloDept=d; hideDept.clear(); DEPT_ORDER.forEach(dd=>{ if(dd!==d) hideDept.add(dd); }); }
  leyenda(); renderStats(); render();
}
function prevMes(){if(mes>0){mes--;render();}}
function nextMes(){if(mes<11){mes++;render();}}
function render(){
  if(view==="mes")renderMes();
  else if(view==="anual")renderAnual();
  else if(view==="pend")renderPend();
  else if(view==="gestionar")renderGestionar();
}

// ─── IMPORTAR ENDALIA ────────────────────────────────────────────────────────
function excelSerialToYMD(serial){
  const d=new Date(Math.round((serial-25569)*86400*1000));
  const y=d.getUTCFullYear(),m=d.getUTCMonth()+1,day=d.getUTCDate();
  return `${y}-${String(m).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}
function parseFechaEndalia(f){
  if(!f&&f!==0) return "";
  if(!isNaN(Number(f))) return excelSerialToYMD(Number(f));
  f=String(f).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(f)) return f.substring(0,10);
  if(/^\d{2}\/\d{2}\/\d{4}/.test(f)){const[dd,mm,yy]=f.split("/");return `${yy}-${mm}-${dd}`;}
  return "";
}
const CAT_IGNORAR=["consulta médica","consulta medica","enfermedad","teletrabajo","otras ausencias","cuidado familiar","it ","baja","accidente"];
const EXCLUIDOS=["LUQUE SALCEDO, BARBARA","LUQUE SALCEDO, BÁRBARA"];

function importarEndalia(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const workbook=XLSX.read(data,{type:"array",raw:true});
      const sheet=workbook.Sheets[workbook.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{raw:true,defval:""});
      let añadidos=0,yaExistian=0,ignorados=0;
      rows.forEach(row=>{
        const empleado=String(row["Empleado"]||"").trim();
        const categoria=String(row["Categoría"]||row["Categoria"]||"").trim().toLowerCase();
        const tipoRaw=String(row["Tipo"]||"").trim().toLowerCase();
        const estado=String(row["Estado"]||"").trim().toLowerCase();
        const unidad=String(row["Unidad"]||"").trim().toLowerCase();
        const fechaIni=row["Fecha inicio"];
        const fechaFin=row["Fecha fin"];
        // Excluir empleados que ya no trabajan
        if(EXCLUIDOS.some(ex=>empleado.toUpperCase().includes(ex))) {ignorados++;return;}
        if(!empleado||!fechaIni||!fechaFin){ignorados++;return;}
        // Ignorar registros en horas
        if(unidad==="horas"){ignorados++;return;}
        // Ignorar históricos/cancelados
        if(estado.includes("histór")||estado.includes("histor")||estado.includes("cancel")){ignorados++;return;}
        // Ignorar categorías no deseadas
        const texto=categoria+" "+tipoRaw;
        if(CAT_IGNORAR.some(c=>texto.includes(c))){ignorados++;return;}
        const i=parseFechaEndalia(fechaIni);
        const f2=parseFechaEndalia(fechaFin);
        if(!i||!f2){ignorados++;return;}
        // Determinar tipo
        let t="vac";
        if(texto.includes("matrimonio")||texto.includes("boda")||texto.includes("pareja de hecho")) t="boda";
        else if(texto.includes("examen")) t="examen";
        else if(!texto.includes("vacacion")) t=tipoRaw.substring(0,40)||"otro";
        // Comprobar si ya existe
        const yaExiste=VACS.some(v=>v.e===empleado&&v.i===i&&v.f===f2&&v.t===t);
        if(yaExiste){yaExistian++;return;}
        VACS.push({e:empleado,i,f:f2,t});
        añadidos++;
      });
      const div=document.getElementById("importResult");
      div.style.display="block";
      if(añadidos>0){
        div.style.background="#d1fae5";div.style.color="#065f46";div.style.border="1px solid #6ee7b7";
        div.innerHTML=`✅ <b>${añadidos} registros nuevos añadidos</b> · ${yaExistian} ya existían · ${ignorados} ignorados`;
      } else {
        div.style.background="#fef3c7";div.style.color="#92400e";div.style.border="1px solid #fcd34d";
        div.innerHTML=`⚠️ Sin cambios: ${yaExistian} ya existían · ${ignorados} ignorados`;
      }
      document.getElementById("inputEndalia").value="";
      renderStats();render();
    }catch(err){
      const div=document.getElementById("importResult");
      div.style.display="block";div.style.background="#fee2e2";div.style.color="#b91c1c";div.style.border="1px solid #fca5a5";
      div.innerHTML="❌ Error: "+err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}
